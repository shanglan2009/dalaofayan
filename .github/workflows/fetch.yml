name: 大佬发言抓取

on:
  schedule:
    # 北京时间 8:50 (UTC 0:50) - 早间推送，周一至周五
    - cron: '50 0 * * 1-5'
    # 北京时间 12:50 (UTC 4:50) - 午间推送，周一至周五
    - cron: '50 4 * * 1-5'
  workflow_dispatch:  # 允许手动触发
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 确定运行模式
        id: mode
        run: |
          if [ "${{ github.event.inputs.mode }}" = "auto" ] || [ -z "${{ github.event.inputs.mode }}" ]; then
            HOUR=$(TZ='Asia/Shanghai' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            else
              echo "mode=noon" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          fi
          echo "mode=$(cat $GITHUB_OUTPUT | grep mode | cut -d= -f2)"

      - name: 运行抓取分析
        env:
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python fetch_and_analyze.py
